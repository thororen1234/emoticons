plugins {
	id 'java'
	id 'xyz.wagyourtail.unimined' version '1.4.1'
}

group = project.maven_group
version = "${project.version}+mc${project.minecraft_version}"

base {
	archivesName = project.archives_base_name
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
	withSourcesJar()
}

repositories {
	mavenCentral()
	maven {
		name = 'Quilt'
		url = 'https://maven.quiltmc.org/repository/release'
	}
}

unimined.minecraft {
	version project.minecraft_version

	mappings {
		ornitheGenVersion = 2
		calamus()
		feather(project.feather_build as int)
	}

	ornitheFabric {
		loader project.loader_version
	}
}

// The `osl(mcVersion, version)` helper on Unimined 1.4.1's fabricApi extension only
// resolves gen1 OSL bundles; this mod needs gen2 (matching the old
// `ploceus.setIntermediaryGeneration(2)` + `ploceus.dependOsl(...)` setup), so we
// resolve the gen2 module coordinates ourselves from Ornithe's meta API.
def ornitheOsl(String mcVersion, String bundleVersion) {
	def slurper = new groovy.json.JsonSlurper()
	def modules = slurper.parseText(new URL("https://meta.ornithemc.net/v3/versions/gen2/osl/${bundleVersion}").text)
	def coords = []
	modules.each { module ->
		def parts = module.maven.split(':')
		def moduleName = parts[1]
		def moduleVersion = parts[2]
		def versions = slurper.parseText(new URL("https://meta.ornithemc.net/v3/versions/gen2/osl/${moduleName}/${mcVersion}/${moduleVersion}").text)
		if (versions) {
			coords << versions[0].maven
		}
	}
	return coords
}

dependencies {
	ornitheOsl(project.minecraft_version, project.osl_version).each {
		modImplementation it
	}
	implementation 'java3d:vecmath:1.5.2'
	include 'java3d:vecmath:1.5.2'

	// Vanilla's bundled Gson lacks JsonParser.parseReader(Reader) (added in 2.8.9)
	// that this mod's own source uses. Under Loom this got transparently overridden
	// by a newer Gson; under Unimined nothing else on the classpath forces a newer
	// version, so force it explicitly.
	implementation 'com.google.code.gson:gson:2.10'
}

processResources {
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
}

jar {
	from('../LICENSE.txt') {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

sourceSets.main.resources {
	exclude 'assets/mclib/**'
}
