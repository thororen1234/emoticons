buildscript {
    repositories {
        jcenter()
        maven { url = 'http://files.minecraftforge.net/maven' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

version = project.mod_version
group = 'mchorse.emoticons'
archivesBaseName = 'emoticons'
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
}

/*
 * ForgeGradle 1.2 predates Mojang's current download service.  Keep the
 * project on ForgeGradle 1.2, but direct its bootstrap tasks to the
 * current official artifact URLs rather than the retired S3 endpoints.
 */
def forgeGradleClassLoader = tasks.downloadClient.class.classLoader
def delayedStringClass = forgeGradleClassLoader.loadClass('net.minecraftforge.gradle.delayed.DelayedString')
def delayedString = { String url ->
    delayedStringClass.getConstructor(Project, String).newInstance(project, url)
}

tasks.downloadClient.setUrl(delayedString(
        'https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar'))
tasks.downloadServer.setUrl(delayedString(
        'https://launcher.mojang.com/mc/game/1.7.10/server/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar'))
tasks.getVersionJson.setUrl(
        'https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json')
tasks.getAssetsIndex.setUrl(
        'https://launchermeta.mojang.com/v1/packages/1863782e33ce7b584fc45b037325a1964e095d3e/1.7.10.json')

/*
 * DownloadAssetsTask in ForgeGradle 1.2 has its object host hard-coded as
 * http://resources.download.minecraft.net, which Mojang now rejects. Fill in
 * missing objects from the equivalent HTTPS host before the legacy task runs;
 * it then finds the files in its normal cache layout and skips its HTTP calls.
 */
tasks.getAssets.doFirst {
    def assetsDir = tasks.getAssets.assetsDir
    def indexFile = new File(assetsDir, "indexes/${tasks.getAssets.indexName}.json")

    if (!indexFile.isFile()) {
        throw new GradleException("Missing Minecraft asset index: ${indexFile}")
    }

    def assetIndex = new groovy.json.JsonSlurper().parse(indexFile)

    assetIndex.objects.each { name, metadata ->
        String hash = metadata.hash
        File destination = new File(assetsDir, "objects/${hash.substring(0, 2)}/${hash}")

        if (destination.isFile() && destination.length() == metadata.size) {
            return
        }

        destination.parentFile.mkdirs()
        File temporary = File.createTempFile(hash, '.part', destination.parentFile)

        try {
            URLConnection connection = new URL("https://resources.download.minecraft.net/${hash.substring(0, 2)}/${hash}").openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 30000

            connection.inputStream.withCloseable { input ->
                temporary.withOutputStream { output -> output << input }
            }

            if (temporary.length() != metadata.size) {
                throw new GradleException("Incomplete Minecraft asset download: ${name}")
            }

            if (destination.exists() && !destination.delete()) {
                throw new GradleException("Couldn't replace Minecraft asset: ${destination}")
            }

            if (!temporary.renameTo(destination)) {
                throw new GradleException("Couldn't store Minecraft asset: ${destination}")
            }
        } finally {
            if (temporary.exists()) {
                temporary.delete()
            }
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
