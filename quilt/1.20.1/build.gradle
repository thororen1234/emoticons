plugins {
	id 'java'
	id 'xyz.wagyourtail.unimined' version '1.4.1'
}

group = project.maven_group
version = "${project.version}+mc${project.minecraft_version}"

base {
	archivesName = project.archives_base_name
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

unimined.minecraft {
	version project.minecraft_version

	mappings {
		intermediary()
		yarn(project.yarn_build as int)
	}

	quilt {
		loader project.loader_version
	}

	mods {
		modImplementation {
			mixinRemap {
				enableBaseMixin()
			}
		}
	}
}

dependencies {
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation 'java3d:vecmath:1.5.2'
	include 'java3d:vecmath:1.5.2'
}

processResources {
	inputs.properties 'version': version, 'minecraft_version': project.minecraft_version

	filesMatching('quilt.mod.json') {
		expand 'version': version, 'minecraft_version': project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
}

jar {
	from('../LICENSE.txt') {
		rename { "${it}_${base.archivesName.get()}" }
	}
}
